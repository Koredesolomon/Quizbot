name: Deploy to Hostinger VPS

on:
  workflow_dispatch:

concurrency:
  group: hostinger-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/vps_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" << 'EOF'
            set -e
            cd "${{ secrets.VPS_PATH }}"
            git fetch origin main
            git reset --hard origin/main
            rm -rf .next
            npm ci
            npm ci --prefix backend
            npm run backend:build
            npm run build

            # Nest reads backend/.env relative to its working directory.
            cd backend
            if pm2 describe tlchub-api > /dev/null 2>&1; then
              pm2 restart tlchub-api --update-env
            else
              NODE_ENV=production pm2 start dist/main.js --name tlchub-api --cwd "$PWD"
            fi
            cd ..

            curl --fail --silent --show-error --retry 12 --retry-delay 5 \
              --retry-connrefused --max-time 5 http://127.0.0.1:4000/health

            pm2 restart tlchub-web --update-env
            pm2 save
          EOF
